name: DAST Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for DAST scan (for example https://app.example.com)"
        required: false
        type: string
  schedule:
    - cron: "0 4 * * 6"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target URL
        shell: bash
        run: |
          TARGET="${{ inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ vars.DAST_TARGET_URL }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "skip_dast=true" >> "$GITHUB_ENV"
            echo "No DAST target URL configured. Set repository variable DAST_TARGET_URL or provide target_url input."
            exit 0
          fi
          echo "target_url=$TARGET" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP baseline
        if: env.skip_dast != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.target_url }}
          fail_action: false
          cmd_options: "-a -j"

