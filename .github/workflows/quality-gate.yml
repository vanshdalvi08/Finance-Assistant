name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_assistant?sslmode=disable
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject tracked environment secret files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.(local|development|production|staging|test)(\.local)?)$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked environment files are forbidden:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Repository secret regression tests
        run: corepack pnpm run test:security-release

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_assistant?sslmode=disable
          NODE_ENV: test
        run: corepack pnpm db:migrate

      - name: Workspace typecheck
        run: corepack pnpm run typecheck

      - name: Build API artifact
        run: corepack pnpm --filter @workspace/api-server run build

      - name: Frontend security header policy
        run: corepack pnpm --filter @workspace/finance-dashboard run test:security-headers

      - name: Authentication hardening unit tests
        run: corepack pnpm --filter @workspace/api-server run test:security-unit

      - name: Workflow and RBAC integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_assistant?sslmode=disable
          NODE_ENV: test
        run: corepack pnpm --filter @workspace/api-server run test:workflow

      - name: API security integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_assistant?sslmode=disable
          NODE_ENV: test
        run: corepack pnpm --filter @workspace/api-server run test:security
