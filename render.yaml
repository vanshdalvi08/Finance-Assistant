services:
  - type: web
    name: finance-assistant-api
    env: node
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AUTH_JWT_ISSUER
        sync: false
      - key: AUTH_JWT_AUDIENCE
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_AVATARS_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_EXPENSE_ATTACHMENTS_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_SALARY_SLIPS_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_MONITORING_WEBHOOK_URL
        sync: false
      - key: PLATFORM_MONITORING_WEBHOOK_TOKEN
        sync: false
      - key: PLATFORM_MONITORING_MIN_SEVERITY
        sync: false
      - key: PLATFORM_MONITORING_ALERT_COOLDOWN_MS
        sync: false
      - key: PLATFORM_MONITORING_WEBHOOK_TIMEOUT_MS
        sync: false
      - key: PLATFORM_BACKUP_STRATEGY
        sync: false
      - key: PLATFORM_BACKUP_FREQUENCY
        sync: false
      - key: PLATFORM_BACKUP_RETENTION_DAYS
        sync: false
      - key: PLATFORM_BACKUP_STORAGE
        sync: false
      - key: PLATFORM_RECOVERY_RUNBOOK_URL
        sync: false
      - key: PLATFORM_LAST_RECOVERY_DRILL_DATE
        sync: false
