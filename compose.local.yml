services:
  postgres:
    image: postgres:18-alpine
    container_name: reforix-payroll-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_assistant_local
      POSTGRES_USER: reforix_local
      POSTGRES_PASSWORD: reforix_local_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforix_local -d finance_assistant_local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - reforix_payroll_local_db:/var/lib/postgresql

volumes:
  reforix_payroll_local_db:
